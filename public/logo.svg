<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" width="260" height="70">
  <defs>
    <clipPath id="iconClip">
      <circle cx="35" cy="35" r="28"/>
    </clipPath>
  </defs>

  <!-- Icon: deep navy circle -->
  <circle cx="35" cy="35" r="28" fill="#0D1B5E"/>

  <!-- Upper sky area -->
  <rect x="7" y="7" width="56" height="31" fill="#0F2272" clip-path="url(#iconClip)"/>

  <!-- Gold horizon line -->
  <rect x="7" y="42" width="56" height="2" fill="#C9A227" clip-path="url(#iconClip)"/>

  <!-- Outer triangle — sky blue -->
  <polygon points="35,11 56,42 14,42" fill="#38B6E8" clip-path="url(#iconClip)"/>

  <!-- Middle cutout — navy -->
  <polygon points="35,18 51,42 19,42" fill="#0D1B5E" clip-path="url(#iconClip)"/>

  <!-- Inner triangle — lighter sky blue -->
  <polygon points="35,23 47,42 23,42" fill="#7DD3FA" clip-path="url(#iconClip)" opacity="0.9"/>

  <!-- Core cutout — navy -->
  <polygon points="35,29 43,42 27,42" fill="#0D1B5E" clip-path="url(#iconClip)"/>

  <!-- Gold diamond at apex -->
  <polygon points="35,6 39,14 35,22 31,14" fill="#C9A227"/>

  <!-- Thin gold ring -->
  <circle cx="35" cy="35" r="28" fill="none" stroke="#C9A227" stroke-width="1.2" opacity="0.55"/>

  <!-- "SORA" — bold deep navy -->
  <text
    x="78" y="32"
    font-family="'Arial Black', Arial, Helvetica, sans-serif"
    font-size="26"
    font-weight="900"
    fill="#0D1B5E"
    letter-spacing="3">SORA</text>

  <!-- Gold separator line -->
  <line x1="78" y1="39" x2="242" y2="39" stroke="#C9A227" stroke-width="0.8"/>

  <!-- "EMPIRE" — gold, wide tracking -->
  <text
    x="79" y="55"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="600"
    fill="#C9A227"
    letter-spacing="9">EMPIRE</text>
</svg>
